name: Validate and publish a version release on main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-speed-changer-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check version, tag and release status
        id: version
        shell: pwsh
        run: ./.github/scripts/release-preflight.ps1
      - name: Build ST and MT and run all regressions
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Check release files and calculate SHA-256
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $files = @('dist/index.html', 'dist/index.mt.html', 'dist/index.self-extract.html', 'dist/index.mt.self-extract.html')
          $lines = foreach ($path in $files) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release artifact: $path" }
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant(), (Split-Path $path -Leaf)
          }
          [System.IO.File]::WriteAllLines((Join-Path (Resolve-Path dist).Path 'SHA256SUMS.txt'), [string[]]$lines, (New-Object System.Text.UTF8Encoding($false)))
      - name: Create version tag and GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ('${{ steps.version.outputs.tag_exists }}' -ne 'true') {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:GITHUB_SHA" --silent
            if ($LASTEXITCODE -ne 0) { throw "Could not create version tag." }
          }
          gh release create $env:RELEASE_TAG `
            dist/index.html `
            dist/index.mt.html `
            dist/index.self-extract.html `
            dist/index.mt.self-extract.html `
            dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "Video Speed Changer $env:RELEASE_TAG" `
            --generate-notes `
            --notes "Validated ST and MT single-HTML builds. MT requires cross-origin isolation."
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
